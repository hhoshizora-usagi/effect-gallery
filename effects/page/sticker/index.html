<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドラッグできるステッカー（Draggable Stickers）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-sticker-area" data-fx="sticker">
  <span class="fx-sticker" style="left: 18%; top: 26%; --r: -10deg; --c: #ffd400">NEW!</span>
  <span class="fx-sticker fx-sticker--round" style="left: 58%; top: 18%; --r: 8deg; --c: #ff3d7f">SALE<br>50%</span>
  <span class="fx-sticker" style="left: 30%; top: 62%; --r: 6deg; --c: #7cff4f">★ HOT ★</span>
  <span class="fx-sticker fx-sticker--round" style="left: 68%; top: 58%; --r: -6deg; --c: #00c2ff">🍡</span>
</div>
<p class="demo-hint" aria-hidden="true">ステッカーをドラッグしてね</p>
<script src="script.js"></script>
</body>
</html>
