<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゆれるベル（Ringing Bell）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-bell-wrap" data-fx="bell">
  <button class="fx-bell" aria-label="通知" aria-expanded="false" aria-controls="fx-bell-list">
    <span class="fx-bell__icon" aria-hidden="true">🔔</span>
    <span class="fx-bell__dot" aria-hidden="true"></span>
  </button>
  <ul class="fx-bell__list" id="fx-bell-list" hidden>
    <li>🎫 チケットの発券が完了しました</li>
    <li>🎸 タイムテーブルが更新されました</li>
    <li>🍔 フードエリアの地図を公開！</li>
  </ul>
</div>
<p class="demo-hint" aria-hidden="true">ベルを押してね</p>
<script src="script.js"></script>
</body>
</html>
