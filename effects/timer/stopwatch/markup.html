<div class="fx-sw" data-fx="stopwatch">
  <div class="fx-sw__face">
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="fx-sw__track" cx="60" cy="60" r="54"/><circle class="fx-sw__ring" cx="60" cy="60" r="54" pathLength="100"/></svg>
    <b class="fx-sw__time" role="timer" aria-live="off">00:00.00</b>
  </div>
  <div class="fx-sw__btns">
    <button class="fx-sw__start">スタート</button>
    <button class="fx-sw__lap" disabled>ラップ</button>
    <button class="fx-sw__reset">リセット</button>
  </div>
  <ol class="fx-sw__laps" aria-label="ラップの記録"></ol>
</div>
