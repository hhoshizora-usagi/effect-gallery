<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビフォーアフター（Before / After）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-ba" data-fx="before-after">
  <!-- 画像は自分のものに差しかえてね（before と after を同じサイズで） -->
  <img class="fx-ba__img" src="../../_shared/sample-city.svg" alt="加工後の写真">
  <div class="fx-ba__before">
    <img class="fx-ba__img fx-ba__img--before" src="../../_shared/sample-city.svg" alt="加工前の写真">
  </div>
  <span class="fx-ba__tag fx-ba__tag--l">BEFORE</span>
  <span class="fx-ba__tag fx-ba__tag--r">AFTER</span>
  <span class="fx-ba__handle" aria-hidden="true"></span>
  <input class="fx-ba__range" type="range" min="0" max="100" value="50" aria-label="ビフォーとアフターの境目">
</div>
<p class="demo-hint" aria-hidden="true">左右にドラッグしてね</p>
<script src="script.js"></script>
</body>
</html>
