<div class="fx-ba" data-fx="before-after">
  <!-- 画像は自分のものに差しかえてね（before と after を同じサイズで） -->
  <img class="fx-ba__img" src="../../_shared/sample-city.svg" alt="加工後の写真">
  <div class="fx-ba__before">
    <img class="fx-ba__img fx-ba__img--before" src="../../_shared/sample-city.svg" alt="加工前の写真">
  </div>
  <span class="fx-ba__tag fx-ba__tag--l">BEFORE</span>
  <span class="fx-ba__tag fx-ba__tag--r">AFTER</span>
  <span class="fx-ba__handle" aria-hidden="true"></span>
  <input class="fx-ba__range" type="range" min="0" max="100" value="50" aria-label="ビフォーとアフターの境目">
</div>
