<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色の幕でリビール（Wipe Reveal）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-wipe-row">
  <figure class="fx-wipe" data-fx="wipe-reveal" style="--c: #ff3d7f">
    <img src="../../_shared/sample-beach.svg" alt="夕暮れのビーチ">
  </figure>
  <figure class="fx-wipe" data-fx="wipe-reveal" style="--c: #00c2ff; --d: .25s">
    <img src="../../_shared/sample-city.svg" alt="夜の街">
  </figure>
</div>
<p class="demo-hint" aria-hidden="true">「もう一度」でくり返し見られるよ</p>
<script src="script.js"></script>
</body>
</html>
