<form class="fx-val" data-fx="validate" novalidate>
  <label for="fx-val-mail">メールで最新情報を受けとる</label>
  <div class="fx-val__row">
    <input id="fx-val-mail" type="email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit" class="fx-val__btn">登録</button>
  </div>
  <p class="fx-val__msg" aria-live="polite"></p>
</form>
