<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード表示＆強さ（Password Meter）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-pw" data-fx="password">
  <label class="fx-pw__label" for="fx-pw-input">パスワード</label>
  <div class="fx-pw__box">
    <input id="fx-pw-input" type="password" autocomplete="new-password" placeholder="8文字以上">
    <button type="button" class="fx-pw__eye" aria-label="パスワードを表示" aria-pressed="false">👁</button>
  </div>
  <div class="fx-pw__meter" aria-hidden="true"><span></span></div>
  <p class="fx-pw__text" aria-live="polite">まだ入力されていません</p>
</div>
<p class="demo-hint" aria-hidden="true">何か入力してみてね</p>
<script src="script.js"></script>
</body>
</html>
