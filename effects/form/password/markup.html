<div class="fx-pw" data-fx="password">
  <label class="fx-pw__label" for="fx-pw-input">パスワード</label>
  <div class="fx-pw__box">
    <input id="fx-pw-input" type="password" autocomplete="new-password" placeholder="8文字以上">
    <button type="button" class="fx-pw__eye" aria-label="パスワードを表示" aria-pressed="false">👁</button>
  </div>
  <div class="fx-pw__meter" aria-hidden="true"><span></span></div>
  <p class="fx-pw__text" aria-live="polite">まだ入力されていません</p>
</div>
