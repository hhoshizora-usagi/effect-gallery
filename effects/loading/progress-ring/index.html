<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進み具合リング（Progress Ring）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<div class="fx-ring" data-fx="progress-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="アップロードの進み具合">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="fx-ring-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff3d7f"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#7cff4f"/>
      </linearGradient>
    </defs>
    <circle class="fx-ring__bg" cx="60" cy="60" r="50"/>
    <circle class="fx-ring__bar" cx="60" cy="60" r="50"/>
  </svg>
  <b class="fx-ring__num">0%</b>
</div>
<p class="demo-hint" aria-hidden="true">「もう一度」でくり返し見られるよ</p>
<script src="script.js"></script>
</body>
</html>
