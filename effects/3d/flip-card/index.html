<head>

<title>3D回転カード（3D Flip Card）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">

<body class="demo">
<div class="fx-flip">
  <div class="fx-flip__card">
    <div class="fx-flip__face fx-flip__front">
      <span class="fx-flip__icon">◆</span>

    <div class="fx-flip__face fx-flip__back">
      <h3>BACK</h3>
      <p>ホバーで裏返る</p>
    </div>
  </div>
</div>
<p class="demo-hint" aria-hidden="true">カードに触れてみてね</p>
<script src="script.js"></script>
