<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きらきら星評価（Star Rating）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<fieldset class="fx-rate" data-fx="rating">
  <legend>このページの評価</legend>
  <div class="fx-rate__stars">
    <input type="radio" name="fx-rate" id="fx-rate-1" value="1"><label for="fx-rate-1" aria-label="星1つ">★</label>
    <input type="radio" name="fx-rate" id="fx-rate-2" value="2"><label for="fx-rate-2" aria-label="星2つ">★</label>
    <input type="radio" name="fx-rate" id="fx-rate-3" value="3"><label for="fx-rate-3" aria-label="星3つ">★</label>
    <input type="radio" name="fx-rate" id="fx-rate-4" value="4"><label for="fx-rate-4" aria-label="星4つ">★</label>
    <input type="radio" name="fx-rate" id="fx-rate-5" value="5"><label for="fx-rate-5" aria-label="星5つ">★</label>
  </div>
  <p class="fx-rate__msg" aria-live="polite">星をえらんでね</p>
</fieldset>
<p class="demo-hint" aria-hidden="true">星をえらんでね</p>
<script src="script.js"></script>
</body>
</html>
