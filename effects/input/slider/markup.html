<div class="fx-slider" data-fx="slider">
  <label class="fx-slider__label" for="fx-slider-input">今日の満足度は？</label>
  <div class="fx-slider__wrap">
    <output class="fx-slider__bubble" for="fx-slider-input">😐 50</output>
    <input id="fx-slider-input" class="fx-slider__input" type="range" min="0" max="100" value="50">
  </div>
</div>
