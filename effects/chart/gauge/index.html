<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スピードメーター（Gauge Meter）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<figure class="fx-gauge" data-fx="gauge" data-value="78">
  <svg viewBox="0 0 200 120" role="img" aria-label="満足度 78点">
    <defs>
      <linearGradient id="fx-gauge-grad">
        <stop offset="0" stop-color="#ff3d7f"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#7cff4f"/>
      </linearGradient>
    </defs>
    <path class="fx-gauge__track" d="M20 100 A80 80 0 0 1 180 100"/>
    <path class="fx-gauge__fill" d="M20 100 A80 80 0 0 1 180 100" pathLength="100"/>
    <g class="fx-gauge__needle"><line x1="100" y1="100" x2="100" y2="34"/><circle cx="100" cy="100" r="9"/></g>
  </svg>
  <figcaption><b class="fx-gauge__num">0</b><small>満足度</small></figcaption>
</figure>
<p class="demo-hint" aria-hidden="true">「もう一度」でくり返し見られるよ</p>
<script src="script.js"></script>
</body>
</html>
