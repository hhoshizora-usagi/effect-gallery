<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>のびる棒グラフ（Growing Bars）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo light">
<figure class="fx-bars" data-fx="bar-grow">
  <figcaption class="fx-bars__title">好きなステージ投票</figcaption>
  <div class="fx-bars__plot">
    <div class="fx-bars__col" style="--v: 72; --c: #ff3d7f"><b>0</b><span></span><small>MAIN</small></div>
    <div class="fx-bars__col" style="--v: 45; --c: #ffd400"><b>0</b><span></span><small>NEON</small></div>
    <div class="fx-bars__col" style="--v: 88; --c: #00c2ff"><b>0</b><span></span><small>SUNSET</small></div>
    <div class="fx-bars__col" style="--v: 30; --c: #7cff4f"><b>0</b><span></span><small>KIDS</small></div>
  </div>
</figure>
<p class="demo-hint" aria-hidden="true">「もう一度」でくり返し見られるよ</p>
<script src="script.js"></script>
</body>
</html>
