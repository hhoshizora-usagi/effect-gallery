<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くるっと円グラフ（Donut Chart）| EFFECT GALLERY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- demo.css は見本ページの土台（背景・中央寄せ）だけ。エフェクト本体は style.css / script.js -->
<link rel="stylesheet" href="../../_shared/demo.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="demo">
<figure class="fx-donut" data-fx="donut">
  <div class="fx-donut__chart">
  <svg viewBox="0 0 42 42" class="fx-donut__svg" role="img" aria-label="来場者の内訳：大人 50%、学生 30%、子ども 20%">
    <circle class="fx-donut__seg" r="15.915" cx="21" cy="21" style="--v: 50; --o: 0;  --c: #ff3d7f"/>
    <circle class="fx-donut__seg" r="15.915" cx="21" cy="21" style="--v: 30; --o: 50; --c: #ffd400"/>
    <circle class="fx-donut__seg" r="15.915" cx="21" cy="21" style="--v: 20; --o: 80; --c: #00c2ff"/>
  </svg>
  <div class="fx-donut__center"><b>3,200</b><small>来場者</small></div>
  </div>
  <ul class="fx-donut__legend">
    <li style="--c: #ff3d7f">大人 50%</li>
    <li style="--c: #ffd400">学生 30%</li>
    <li style="--c: #00c2ff">子ども 20%</li>
  </ul>
</figure>
<p class="demo-hint" aria-hidden="true">項目にマウスを乗せてみてね</p>
<script src="script.js"></script>
</body>
</html>
